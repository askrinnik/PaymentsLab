name: Compose smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # MongoDB 8.0 does not start on Linux kernels 6.19 - 7.0.13 (SERVER-121912). Newer ubuntu-24.04 runner images
    # have such a kernel, so the jobs run on ubuntu-22.04. Go back to ubuntu-latest once the runner kernel is
    # 7.0.14 or newer; the "Show kernel" step prints it.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - name: Show kernel
        run: uname -r

      # Waits for the mongo and rabbitmq healthchecks; api has no healthcheck, so it is only "running".
      - name: Start the stack
        run: docker compose up -d --build --wait

      # The API may still be starting, so retry until /health answers.
      - name: Check /health
        run: curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8080/health

      - name: Show logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v
