name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # MongoDB 8.0 does not start on Linux kernels 6.19 - 7.0.13 (SERVER-121912). Newer ubuntu-24.04 runner images
    # have such a kernel, so the jobs run on ubuntu-22.04. Go back to ubuntu-latest once the runner kernel is
    # 7.0.14 or newer; the "Show kernel" step prints it.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - name: Show kernel
        run: uname -r

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors (Directory.Build.props).
      - name: Build
        run: dotnet build --no-restore -c Release

      # Needs Docker: Testcontainers starts mongo:8.0 as a single-node replica set.
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: src/TestResults/
          if-no-files-found: warn

      - name: Build API image
        run: docker build -t payments-api:ci .
